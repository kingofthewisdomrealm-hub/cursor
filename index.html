<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Power Mapper — Mapa de Poder Fiscal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">◈</div>
        <div>
          <h1>Tax Power Mapper</h1>
          <p>Mapa de Poder Fiscal</p>
        </div>
      </div>
      <nav class="nav" id="main-nav">
        <button class="nav-item active" data-view="dashboard">
          <span class="nav-icon">▣</span> Panel
        </button>
        <button class="nav-item" data-view="income">
          <span class="nav-icon">＋</span> Ingreso
        </button>
        <button class="nav-item" data-view="expense">
          <span class="nav-icon">－</span> Gasto
        </button>
        <button class="nav-item" data-view="sifting">
          <span class="nav-icon">◎</span> SIFTING
          <span class="badge" id="sifting-badge" hidden>0</span>
        </button>
        <button class="nav-item" data-view="documentation">
          <span class="nav-icon">☰</span> Documentación
        </button>
        <button class="nav-item" data-view="calculator">
          <span class="nav-icon">％</span> ISR + IVA
        </button>
        <button class="nav-item" data-view="reports">
          <span class="nav-icon">↗</span> Reportes
        </button>
        <button class="nav-item" data-view="score">
          <span class="nav-icon">★</span> Preparación
        </button>
      </nav>
      <p class="disclaimer">Herramienta orientativa conforme a LISR y LIVA. No es asesoría fiscal del SAT. Consulte con un contador público.</p>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">
          <h2 id="view-title">Panel Principal</h2>
          <p id="view-subtitle">Centro de control financiero</p>
        </div>
        <div class="topbar-date" id="current-date"></div>
      </header>

      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" data-close-modal aria-label="Cerrar">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
