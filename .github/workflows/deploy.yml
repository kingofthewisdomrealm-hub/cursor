name: Deploy to GitHub Pages

# Note: Outcome Agent requires Next.js server/API routes for full functionality.
# For production, deploy to Vercel, Railway, or similar Node hosting.
# This workflow validates the production build only.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
